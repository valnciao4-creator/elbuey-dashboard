<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Buey — Dashboard de Servicio</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { background: #f5f5f5; padding: 1rem; }
.header { background: #1a1a1a; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.logo-pill { background: #cc1f1f; border-radius: 6px; padding: 4px 12px; font-size: 13px; font-weight: 500; color: #fff; }
.header-right { text-align: right; }
.header-title { color: #fff; font-size: 14px; font-weight: 500; }
.header-sub { color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 2px; }
.metric-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 12px; }
.metric { background: #fff; border-radius: 8px; padding: 12px; border: 0.5px solid #e0e0e0; }
.metric-label { font-size: 11px; color: #888; margin-bottom: 4px; }
.metric-val { font-size: 22px; font-weight: 500; color: #1a1a1a; }
.metric-val.green { font-size: 15px; color: #3B6D11; margin-top: 2px; }
.metric-val.red { font-size: 15px; color: #cc1f1f; margin-top: 2px; }
.metric-sub { font-size: 11px; color: #888; margin-top: 2px; }
.card { background: #fff; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; border: 0.5px solid #e0e0e0; }
.section-label { font-size: 11px; font-weight: 500; color: #888; letter-spacing: 0.04em; margin-bottom: 10px; }
.tab-row { display: flex; gap: 6px; margin-bottom: 10px; }
.tab { padding: 5px 14px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 12px; cursor: pointer; color: #888; background: none; }
.tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.mesero-row { padding: 10px 0; border-bottom: 0.5px solid #eee; cursor: pointer; }
.mesero-row:last-child { border-bottom: none; }
.mesero-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: #fff; flex-shrink: 0; }
.av1{background:#cc1f1f;} .av2{background:#2a2a2a;} .av3{background:#555;} .av4{background:#888;}
.mesero-name { font-size: 13px; font-weight: 500; color: #1a1a1a; flex: 1; }
.score-big { font-size: 15px; font-weight: 500; color: #1a1a1a; }
.badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; margin-left: 4px; }
.bg{background:#EAF3DE;color:#3B6D11;} .ba{background:#FAEEDA;color:#854F0B;} .br{background:#FCEBEB;color:#A32D2D;}
.eval-count { font-size: 11px; color: #888; margin-bottom: 5px; }
.eval-count span { font-weight: 500; color: #1a1a1a; }
.bar-wrap { height: 5px; background: #f0f0f0; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.bar-fill { height: 100%; border-radius: 3px; }
.hl-row { display: flex; gap: 6px; }
.hl-box { flex: 1; border-radius: 8px; padding: 6px 8px; }
.hl-green { background: #EAF3DE; }
.hl-red { background: #FCEBEB; }
.hl-label { font-size: 10px; font-weight: 500; margin-bottom: 2px; }
.hl-green .hl-label { color: #3B6D11; }
.hl-red .hl-label { color: #A32D2D; }
.hl-val { font-size: 11px; color: #1a1a1a; }
.detail-hl { display: none; }
.comment-row { padding: 10px 0; border-bottom: 0.5px solid #eee; }
.comment-row:last-child { border-bottom: none; }
.comment-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.comment-name { font-size: 12px; font-weight: 500; color: #1a1a1a; }
.comment-mesero { font-size: 11px; color: #888; }
.comment-text { font-size: 13px; color: #333; line-height: 1.5; }
.stars-sm { display: flex; gap: 2px; font-size: 12px; }
.star-lit { color: #cc1f1f; }
.star-empty { color: #ddd; }
.password-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
.password-card { background: #fff; border-radius: 12px; padding: 2rem; border: 0.5px solid #e0e0e0; width: 100%; max-width: 320px; text-align: center; }
.pw-logo { background: #1a1a1a; border-radius: 10px; padding: 1rem; margin: 0 auto 1.5rem; display: inline-block; }
.pw-title { font-size: 16px; font-weight: 500; color: #1a1a1a; margin-bottom: 6px; }
.pw-sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
.pw-input { width: 100%; padding: 10px 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; margin-bottom: 10px; outline: none; }
.pw-btn { width: 100%; padding: 11px; background: #cc1f1f; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
.pw-error { font-size: 12px; color: #cc1f1f; margin-top: 8px; display: none; }
.main { display: none; max-width: 480px; margin: 0 auto; }
</style>
</head>
<body>

<div class="password-screen" id="pw-screen">
  <div class="password-card">
    <div class="pw-logo">
      <div style="background:#cc1f1f;border-radius:6px;padding:4px 12px;font-size:14px;font-weight:500;color:#fff;">EL BUEY</div>
    </div>
    <div class="pw-title">Dashboard de Servicio</div>
    <div class="pw-sub">Acceso exclusivo para el administrador</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="pw-btn" onclick="checkPw()">Entrar</button>
    <div class="pw-error" id="pw-error">Contraseña incorrecta</div>
  </div>
</div>

<div class="main" id="main">
  <div class="header">
    <div><div class="logo-pill">EL BUEY</div></div>
    <div class="header-right">
      <div class="header-title">Dashboard de servicio</div>
      <div class="header-sub" id="dash-sub">Cargando...</div>
    </div>
  </div>

  <div class="metric-grid">
    <div class="metric">
      <div class="metric-label">Promedio general</div>
      <div class="metric-val" id="m-promedio">—</div>
      <div class="metric-sub">de 5 estrellas</div>
    </div>
    <div class="metric">
      <div class="metric-label">Total evaluaciones</div>
      <div class="metric-val" id="m-total">—</div>
      <div class="metric-sub">este mes</div>
    </div>
    <div class="metric">
      <div class="metric-label">Mejor mesero</div>
      <div class="metric-val green" id="m-mejor">—</div>
      <div class="metric-sub" id="m-mejor-sub">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Necesita atención</div>
      <div class="metric-val red" id="m-peor">—</div>
      <div class="metric-sub" id="m-peor-sub">—</div>
    </div>
  </div>

  <div class="tab-row">
    <button class="tab active" onclick="setTab('ranking',this)">Ranking</button>
    <button class="tab" onclick="setTab('comentarios',this)">Comentarios</button>
  </div>

  <div id="view-ranking">
    <div class="card">
      <div class="section-label">Toca un mesero para ver su detalle</div>
      <div id="ranking-list"></div>
    </div>
  </div>

  <div id="view-comentarios" style="display:none">
    <div class="card">
      <div class="section-label">Comentarios recientes</div>
      <div id="comentarios-list"></div>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'elbuey2026';

const DATOS = {
  meseros: [
    { nombre: 'Carlos Ramírez', av: 'CR', avClass: 'av1', rapidez: 4.2, amabilidad: 4.5, conocimiento: 4.0, presentacion: 4.3, actitud: 4.1, resolucion: 3.9, evaluaciones: 12, mejor: 'Amabilidad y trato', peor: 'Resolución de problemas' },
    { nombre: 'Ana Martínez',   av: 'AM', avClass: 'av2', rapidez: 3.5, amabilidad: 3.8, conocimiento: 3.2, presentacion: 3.7, actitud: 3.4, resolucion: 3.6, evaluaciones: 8,  mejor: 'Amabilidad y trato', peor: 'Conocimiento del menú' },
    { nombre: 'Luis García',    av: 'LG', avClass: 'av3', rapidez: 3.0, amabilidad: 3.1, conocimiento: 3.5, presentacion: 2.9, actitud: 2.8, resolucion: 3.0, evaluaciones: 9,  mejor: 'Conocimiento del menú', peor: 'Actitud proactiva' },
    { nombre: 'Sofía Pérez',    av: 'SP', avClass: 'av4', rapidez: 4.8, amabilidad: 4.9, conocimiento: 4.7, presentacion: 4.6, actitud: 4.8, resolucion: 4.7, evaluaciones: 18, mejor: 'Amabilidad y trato', peor: 'Presentación personal' },
  ],
  comentarios: [
    { nombre: 'María González', mesero: 'Sofía Pérez', mesa: '7', estrellas: 5, texto: 'Sofía estuvo excelente, muy atenta y rápida.' },
    { nombre: 'Anónimo',        mesero: 'Luis García',  mesa: '5', estrellas: 3, texto: 'Tardó mucho en tomar la orden.' },
    { nombre: 'Roberto Sánchez',mesero: 'Carlos Ramírez',mesa:'2', estrellas: 4, texto: 'Muy amable, nos recomendó bien los cortes.' },
    { nombre: 'Anónimo',        mesero: 'Ana Martínez', mesa: '3', estrellas: 4, texto: 'Buena atención pero no sabía los ingredientes del menú del día.' },
  ]
};

function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === PASSWORD) {
    document.getElementById('pw-screen').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    renderDashboard();
  } else {
    document.getElementById('pw-error').style.display = 'block';
  }
}

function promedio(m) {
  return (m.rapidez + m.amabilidad + m.conocimiento + m.presentacion + m.actitud + m.resolucion) / 6;
}

function badge(p) {
  if (p >= 4.2) return '<span class="badge bg">Excelente</span>';
  if (p >= 3.5) return '<span class="badge ba">Regular</span>';
  return '<span class="badge br">Mejorar</span>';
}

function barColor(p) {
  if (p >= 4.2) return '#639922';
  if (p >= 3.5) return '#EF9F27';
  return '#cc1f1f';
}

function starsHtml(n) {
  let s = '';
  for (let i = 1; i <= 5; i++) s += `<span class="${i<=n?'star-lit':'star-empty'}">★</span>`;
  return s;
}

function renderDashboard() {
  const sorted = [...DATOS.meseros].sort((a,b) => promedio(b) - promedio(a));
  const total = DATOS.meseros.reduce((s,m) => s + m.evaluaciones, 0);
  const mejor = sorted[0];
  const peor = sorted[sorted.length-1];
  const prom = DATOS.meseros.reduce((s,m) => s + promedio(m), 0) / DATOS.meseros.length;

  document.getElementById('dash-sub').textContent = `Mayo 2026 · ${total} evaluaciones`;
  document.getElementById('m-promedio').textContent = prom.toFixed(1) + ' ★';
  document.getElementById('m-total').textContent = total;
  document.getElementById('m-mejor').textContent = mejor.nombre.split(' ')[0] + ' ' + mejor.nombre.split(' ')[1][0] + '.';
  document.getElementById('m-mejor-sub').textContent = promedio(mejor).toFixed(1) + ' · ' + mejor.evaluaciones + ' evaluaciones';
  document.getElementById('m-peor').textContent = peor.nombre.split(' ')[0] + ' ' + peor.nombre.split(' ')[1][0] + '.';
  document.getElementById('m-peor-sub').textContent = promedio(peor).toFixed(1) + ' · ' + peor.evaluaciones + ' evaluaciones';

  let rankHtml = '';
  sorted.forEach((m, i) => {
    const p = promedio(m);
    const pct = (p / 5 * 100).toFixed(0);
    rankHtml += `
    <div class="mesero-row" onclick="toggleDetail(this)">
      <div class="mesero-top">
        <div style="font-size:11px;color:#888;width:12px;">${i+1}</div>
        <div class="avatar ${m.avClass}">${m.av}</div>
        <div class="mesero-name">${m.nombre} ${badge(p)}</div>
        <div class="score-big">${p.toFixed(1)} ★</div>
      </div>
      <div class="eval-count"><span>${m.evaluaciones}</span> evaluaciones este mes</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${barColor(p)}"></div></div>
      <div class="hl-row detail-hl">
        <div class="hl-box hl-green"><div class="hl-label">MEJOR ASPECTO</div><div class="hl-val">${m.mejor}</div></div>
        <div class="hl-box hl-red"><div class="hl-label">A MEJORAR</div><div class="hl-val">${m.peor}</div></div>
      </div>
    </div>`;
  });
  document.getElementById('ranking-list').innerHTML = rankHtml;

  let comHtml = '';
  DATOS.comentarios.forEach(c => {
    comHtml += `
    <div class="comment-row">
      <div class="comment-meta">
        <div><div class="comment-name">${c.nombre}</div><div class="comment-mesero">${c.mesero} · Mesa ${c.mesa}</div></div>
        <div class="stars-sm">${starsHtml(c.estrellas)}</div>
      </div>
      <div class="comment-text">${c.texto}</div>
    </div>`;
  });
  document.getElementById('comentarios-list').innerHTML = comHtml;
}

function toggleDetail(row) {
  const hl = row.querySelector('.detail-hl');
  const isOpen = hl.style.display === 'flex';
  document.querySelectorAll('.detail-hl').forEach(h => h.style.display = 'none');
  if (!isOpen) hl.style.display = 'flex';
}

function setTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-ranking').style.display = tab === 'ranking' ? 'block' : 'none';
  document.getElementById('view-comentarios').style.display = tab === 'comentarios' ? 'block' : 'none';
}
</script>
</body>
</html>
